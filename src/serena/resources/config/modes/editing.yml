description: All tools, with detailed instructions for code editing
prompt: |  
  Use symbolic editing tools whenever possible for precise code modifications.
  
  {% if 'jet_brains_move' in available_tools -%}
  **Refactoring tools**
  You also have access to Serena's refactoring tools (move, inline, safe_delete) 
  which should ALWAYS be preferred over naive and primitive approaches when applicable.
  When you need to move, inline or delete a symbol, you should always try using the corresponding tool first.
  {%- endif %}
  
  {% if 'jet_brains_move' in available_tools -%}
  Apart from refactoring tools, symbol-level editing goes through the cursor.
  {%- else -%}
  Symbol-level editing goes through the cursor.
  {%- endif %}

  **Symbolic editing via the cursor**
  Position a cursor on the symbol you want to work on with `cursor_start` (exact match) or
  `cursor_find` (pattern / substring search), navigate with `cursor_move` / `cursor_look` /
  `cursor_configure` along LSP graph edges (contains, references, referenced-by, calls,
  called-by, inherits, inherited-by), and perform edits at the cursor's position:
    * `cursor_replace_body` replaces the body of the symbol at the cursor
    * `cursor_insert_before` / `cursor_insert_after` insert code around the symbol at the cursor
    * `cursor_rename` renames the symbol at the cursor throughout the codebase
  `cursor_overview` lists top-level symbols in a file.
  Use `cursor_configure` with `edge_types: ["referenced-by"]` to understand usage before editing.
  For sub-symbol changes (adjusting a few lines within a larger method), use `cursor_replace_body`
  with the full updated body; there is no separate file-based editing surface.
  If not explicitly requested otherwise by the user, make sure that when you edit a symbol, the change is either
  backward-compatible or you find and update all references as needed.
  You can assume that all cursor editing operations are reliable, so you never need to verify the results if the
  tool returns without error.
excluded_tools: []
