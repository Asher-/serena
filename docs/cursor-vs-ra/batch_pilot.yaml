topic_root: topic://project.serena.cursor-vs-ra

# Pilot for iina/iina#5909 "Scrub by Mouse Drag Mishandles Next Video".
#
# Both arms run the SAME prompt (templates/agent-prompt.md, embedded below).
# Only the tool surface differs:
#   - cursor-arm-worker: 8 cursor tools (locality-preserving navigation)
#   - ra-arm-worker:     4 RA tools (random-access symbol search)
# Symbol bodies are reachable through each paradigm's own surface
# (cursor_configure include_body=true; find_symbol include_body=true).
# Raw file-read tools are NOT exposed — that would conflate paradigm
# difference with access granularity.
#
# 3 runs per arm for variance. Each task spawns its own stdio serena
# (mcp-config.json), so each Claude gets a fresh per-process MCP session
# and a fresh CursorManager. The shared-SSE/launchd model from earlier
# revisions is dropped: opt-in edge resolution (DEFAULT_EDGE_TYPES =
# frozenset()) removes the cold-start LSP tax that motivated sharing one
# long-running serena, and a single SSE process serialised concurrent
# tasks anyway (task_executor is a single-threaded queue).
#
# Each task writes findings.md (final hypothesis text) under runs/<id>/.
# Per-task transcript with tool calls is recorded by orchestrate's
# session machinery under /Users/asher/.claude-server/<session-id>/.

tasks:
  - id: cursor-0
    roots: [topic://project.serena.cursor-vs-ra]
    findings: /Users/asher/Dropbox/Projects/claude/serena/docs/cursor-vs-ra/runs/cursor-0/findings.md
    skip_preamble: true
    options:
      mcp_config:
        - /Users/asher/Dropbox/Projects/claude/serena/docs/cursor-vs-ra/mcp-config.json
      strict_mcp_config: true
