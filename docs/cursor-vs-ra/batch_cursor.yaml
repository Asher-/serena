# Cursor-arm half of the pilot. Run this then batch_ra.yaml — sequential
# halves keep concurrency at 3.
#
# Tool isolation:
#   - cursor-arm-context.yml's `excluded_tools` is the hard MCP-level
#     boundary: the serena MCP server physically does not advertise
#     search_for_pattern, find_symbol, find_referencing_symbols,
#     get_symbols_overview, the edit tools, or memory tools. That is the
#     only thing actually keeping the arms isolated.
#   - `--tools Write,ToolSearch` (via builtin_tools) restricts the BUILTIN
#     tool surface to those two so the agent cannot reach for Read / Bash /
#     Grep / Edit / Glob.
#   - We do NOT pass `--allowedTools`. It's a soft model-level hint (not a
#     hard limit) and triggers claude CLI 2.1.119's deferred-tools gating
#     pathologies. See memory://serena/project/claude-cli-allowed-tools-threshold.
#   - `settings: ~/.claude/orchestrate-settings/cursor-arm.json` overrides
#     claude CLI's settings hierarchy at the runtime layer, replacing the
#     user-level SessionStart hook (which dumps ~180KB of brain-context and
#     corrupts deferred-tools registration so the model sees no MCP tools).
#     Without this override, orchestrate-spawned cursor sessions list only
#     Write+ToolSearch and call ToolSearch 30-60x finding nothing. See
#     memory://serena/project/claude-cli-mcp-tools-need-project-settings-override.
#
# v3 surface (post commits e7bbe1c7 cursor_grep + 04f077a3 opt-in projection
# + b77c80a2 cursor.lsp_timing + 310bc850 required-because + cursor_narrate):
# cursor_grep is the breadth-discovery primitive (textual regex → cursor at
# every enclosing LSP symbol) — directly targeting the v2 judge's #1
# complaint that cursor traces explored narrower surfaces than RA.
# cursor_narrate writes a fresh `why` onto a cursor without moving —
# directly targeting the v2 judge's #2 complaint that cursor traces had
# near-silent turns. The prompt below teaches both.

