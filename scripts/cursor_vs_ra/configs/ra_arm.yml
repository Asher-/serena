# Random-access (symbolic) arm of the cursor-vs-RA pilot.
#
# Loaded as a serena CONTEXT (passed via --context <path>), NOT a mode — see
# cursor_arm.yml for the underlying reason (default_modes drop fixed_tools
# in SerenaAgent._create_base_toolset).
#
# Exposes only the LSP-rooted symbol tools and search_for_pattern as a fixed set.
# No read_file tool exists in serena (file_tools.py contains only SearchForPatternTool),
# so this arm is a "symbolic-RA" surface, not a byte-level RA surface; both arms
# are LSP-rooted and only the navigation topology differs.
description: Random-access (symbolic) arm for the cursor-vs-RA pilot.
prompt: |
  You are running in an agent context.

  You are operating in the random-access arm of a code-navigation paradigm comparison.
  Your only available tools are the LSP-rooted symbol-lookup tools and a regex search.
  Each call is independent: there is no persistent navigation cursor.
fixed_tools:
  - find_symbol
  - find_referencing_symbols
  - get_symbols_overview
  - search_for_pattern
